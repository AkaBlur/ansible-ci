---

name: Ansible Galaxy Role Upload

on:
  workflow_call:
    secrets:
      galaxy_token:
        description: Ansible Galaxy access token
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Convert repository owner name
        id: repo_owner
        run: |
          _NAME=$(echo ${GITHUB_REPOSITORY_OWNER,,} | tr ".-" "_");
          echo "repo_owner=${_NAME}" >> $GITHUB_OUTPUT


      - name: Extract repository role name
        id: role_name
        run: |
          _ROLE=${GITHUB_REPOSITORY#*/};
          echo "role_name=${_ROLE}" >> $GITHUB_OUTPUT

      - name: Import Ansible role in Galaxy
        run: |
          ansible-galaxy role import ${{ steps.repo_owner.outputs.repo_owner }} ${{ steps.role_name.outputs.role_name }} --token ${{ secrets.galaxy_token }}
